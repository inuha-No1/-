<script>
  const members = [
    { name: "いぬは", icon: "assets/inuhaaikonn.jpg" },
    { name: "さや", icon: "assets/sayaaikonn.jpg" },
    { name: "いざなぎ", icon: "assets/izanagiaikonn.jpg" },
    { name: "たにおか", icon: "assets/taniokaaikonn.jpg" },
    { name: "すさのお", icon: "assets/susanooaikonn.jpg" },
  ];

  let index = 0;

  function update() {
    document.getElementById("name").textContent = members[index].name;
    document.getElementById("icon").src = members[index].icon;
  }

  function next() {
    index = (index + 1) % members.length;
    update();
  }

  function prev() {
    index = (index - 1 + members.length) % members.length;
    update();
  }
</script>
